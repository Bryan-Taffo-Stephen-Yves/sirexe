# Sirexe · publication du dossier web/ sur GitHub Pages (site statique, sans build).
# Une fois : Settings → Pages → Source : « GitHub Actions ».
# Ensuite : Actions → « Publier sur GitHub Pages » → Run workflow.
# Lancement manuel seulement, pour ne pas échouer à chaque push tant que Pages n'est pas activé
# (sur un dépôt privé, Pages demande un compte GitHub payant).
name: Publier sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
